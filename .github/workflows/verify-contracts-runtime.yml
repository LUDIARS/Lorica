name: Verify contracts across DLLs
on:
  push:
    branches: [verify/contracts-runtime-pr1]
permissions:
  contents: read
jobs:
  msvc:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install original PR package
        run: |
          git worktree add --detach ../old aae0229e20d91df8cc4d65bb845f9e182295cc7a
          cmake -S ../old -B old-build -G "Visual Studio 17 2022" -A x64
          cmake --build old-build --config Release
          cmake --install old-build --config Release --prefix "$env:RUNNER_TEMP/old-prefix"
      - name: Reproduce two independent handler slots
        run: |
          cmake -S tests/contract_modules -B old-probe -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/old-prefix" -DLORICA_TEST_HANDLER_STATE=split
          cmake --build old-probe --config Release
          ctest --test-dir old-probe -C Release -V --no-tests=error
      - name: Build shared runtime and consumers
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DLORICA_BUILD_TESTS=ON
          cmake --build build --config Release
          cmake --install build --config Release --prefix "$env:RUNNER_TEMP/fixed-prefix"
      - name: Check installed DLL and import library
        run: |
          cmake -S tests/contract_modules -B fixed-probe -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/fixed-prefix"
          cmake --build fixed-probe --config Release
          ctest --test-dir fixed-probe -C Release -V --no-tests=error
      - name: Run full test suite
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
