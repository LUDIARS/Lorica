# Builds and runs the whole registered suite (spec/test/verification.md). Nothing is
# fetched by the build; only the checkout action and the runner's own packages are used.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # The image's GCC 13 and Clang 18 with glibc 2.39 qualify for EXTENDED, so a
      # regression that disables the extended-profile tests fails configuration.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLORICA_BUILD_TESTS=ON -DLORICA_BUILD_EXAMPLES=ON -DLORICA_TEST_REQUIRE_EXTENDED=ON
          "-DCMAKE_CXX_FLAGS=-Wall -Wextra -Werror"
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 2

  # GCC's sanitizer runtimes (the image's Clang has none). Every registered test
  # runs; none is excluded. In the AddressSanitizer build
  # lorica.hardening_stops.fortify reports itself skipped (ASan reports the
  # overflowing copy before glibc's FORTIFY check can), never passed.
  sanitizers:
    name: linux sanitizers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: address+undefined
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
            options: ""
          # Also registers lorica.pack.readers_tsan and the shared-state oracle.
          - name: thread
            flags: -fsanitize=thread
            options: -DLORICA_ANALYSIS_TSAN_ORACLE=ON
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # ThreadSanitizer cannot map its shadow memory with the runner's default
      # address-space randomization.
      - name: Lower ASLR entropy for ThreadSanitizer
        if: matrix.name == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release
          -DLORICA_BUILD_TESTS=ON -DLORICA_BUILD_EXAMPLES=ON ${{ matrix.options }}
          "-DCMAKE_CXX_FLAGS=-Wall -Wextra -Werror ${{ matrix.flags }}"
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 2

  # Never run before this workflow existed: expect failures on the first runs.
  windows:
    name: windows (msvc x64, Release)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -A x64 -DLORICA_BUILD_TESTS=ON -DLORICA_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
